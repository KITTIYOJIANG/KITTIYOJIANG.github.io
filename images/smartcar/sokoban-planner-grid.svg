<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI Vision Smart Car Sokoban Planner Grid</title>
  <desc id="desc">A portfolio illustration showing a 16 by 12 Sokoban grid, boxes, targets, planned path, and compiled vehicle commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#e8eef5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17324d" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b35"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="48" y="42" width="1104" height="591" rx="8" fill="#ffffff" filter="url(#shadow)"/>

  <g transform="translate(84 78)">
    <text x="0" y="0" fill="#18324a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">AI Vision Smart Car Sokoban Planner</text>
    <text x="0" y="34" fill="#55708a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">16x12 grid parsing · BFS/A* planning · vehicle-command compilation · OpenMV camera tuning</text>
  </g>

  <g transform="translate(84 142)">
    <rect x="0" y="0" width="736" height="480" rx="6" fill="#23313f"/>
    <g transform="translate(20 18)">
      <rect x="0" y="0" width="640" height="432" fill="#172431"/>
      <g stroke="#2e4257" stroke-width="1">
        <path d="M 0 0 H 640 M 0 36 H 640 M 0 72 H 640 M 0 108 H 640 M 0 144 H 640 M 0 180 H 640 M 0 216 H 640 M 0 252 H 640 M 0 288 H 640 M 0 324 H 640 M 0 360 H 640 M 0 396 H 640 M 0 432 H 640"/>
        <path d="M 0 0 V 432 M 40 0 V 432 M 80 0 V 432 M 120 0 V 432 M 160 0 V 432 M 200 0 V 432 M 240 0 V 432 M 280 0 V 432 M 320 0 V 432 M 360 0 V 432 M 400 0 V 432 M 440 0 V 432 M 480 0 V 432 M 520 0 V 432 M 560 0 V 432 M 600 0 V 432 M 640 0 V 432"/>
      </g>
      <g fill="#445b70">
        <rect x="0" y="0" width="640" height="36"/>
        <rect x="0" y="396" width="640" height="36"/>
        <rect x="0" y="0" width="40" height="432"/>
        <rect x="600" y="0" width="40" height="432"/>
        <rect x="240" y="144" width="40" height="180"/>
        <rect x="360" y="72" width="40" height="144"/>
        <rect x="400" y="252" width="120" height="36"/>
      </g>
      <g fill="none" stroke="#ff6b35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
        <path d="M 180 234 H 220 V 270 H 300 V 234 H 340"/>
      </g>
      <g>
        <rect x="160" y="216" width="40" height="36" rx="6" fill="#50c878"/>
        <path d="M 169 241 L 180 225 L 191 241 Z" fill="#0d3b24"/>
      </g>
      <g>
        <rect x="320" y="216" width="40" height="36" rx="5" fill="#ffd166"/>
        <text x="340" y="240" text-anchor="middle" fill="#513800" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">a</text>
        <rect x="480" y="216" width="40" height="36" rx="5" fill="#ffd166"/>
        <text x="500" y="240" text-anchor="middle" fill="#513800" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">b</text>
      </g>
      <g>
        <circle cx="500" cy="342" r="15" fill="#7bdff2"/>
        <text x="500" y="348" text-anchor="middle" fill="#073642" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">A</text>
        <circle cx="540" cy="126" r="15" fill="#f28482"/>
        <text x="540" y="132" text-anchor="middle" fill="#4a1313" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">B</text>
      </g>
    </g>
    <g transform="translate(694 32)" font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="0" y="0" fill="#dbe8f4" font-size="15" font-weight="700">Planner output</text>
      <rect x="0" y="22" width="20" height="20" rx="4" fill="#50c878"/>
      <text x="30" y="38" fill="#c9d7e4" font-size="13">car pose</text>
      <rect x="0" y="58" width="20" height="20" rx="4" fill="#ffd166"/>
      <text x="30" y="74" fill="#c9d7e4" font-size="13">labeled box</text>
      <circle cx="10" cy="106" r="10" fill="#7bdff2"/>
      <text x="30" y="111" fill="#c9d7e4" font-size="13">matching target</text>
    </g>
  </g>

  <g transform="translate(858 172)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="0" fill="#18324a" font-size="20" font-weight="700">Compiled command stream</text>
    <g fill="#f3f7fb" stroke="#d5e1ec">
      <rect x="0" y="28" width="250" height="62" rx="6"/>
      <rect x="0" y="108" width="250" height="62" rx="6"/>
      <rect x="0" y="188" width="250" height="62" rx="6"/>
      <rect x="0" y="268" width="250" height="62" rx="6"/>
    </g>
    <g fill="#18324a" font-size="15">
      <text x="18" y="62" font-weight="700">move_to(row, col)</text>
      <text x="18" y="142" font-weight="700">align_to_box(box, dir)</text>
      <text x="18" y="222" font-weight="700">push_box(dir, cells)</text>
      <text x="18" y="302" font-weight="700">replay validation</text>
    </g>
    <g fill="#55708a" font-size="12">
      <text x="18" y="78">straight grid segments</text>
      <text x="18" y="158">behind-box positioning</text>
      <text x="18" y="238">compressed push distance</text>
      <text x="18" y="318">PASS / fail-safe checks</text>
    </g>
    <g fill="none" stroke="#ff6b35" stroke-width="3" marker-end="url(#arrow)">
      <path d="M 125 90 V 104"/>
      <path d="M 125 170 V 184"/>
      <path d="M 125 250 V 264"/>
    </g>
  </g>
</svg>
