<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">SmartLine-IoT architecture diagram</title>
  <desc id="desc">A four-layer industrial IoT pipeline from devices to dashboard, with alert and history data flows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#e8f1f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1200" height="620" rx="26" fill="url(#bg)"/>
  <rect x="54" y="48" width="1092" height="524" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="54" y="48" width="1092" height="92" rx="24" fill="url(#accent)"/>
  <path d="M54 116 H1146 V140 H54 Z" fill="url(#accent)"/>

  <text x="92" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">SmartLine-IoT Production Monitoring</text>
  <text x="92" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#dff8ff">Device data collection, status monitoring, alerts, and dashboard display</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(92 210)">
      <rect width="210" height="162" rx="16" fill="#eefdf8" stroke="#0f766e" stroke-width="2"/>
      <circle cx="44" cy="44" r="20" fill="#0f766e"/>
      <path d="M36 44 H52 M44 36 V52" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <text x="28" y="92" font-size="24" font-weight="700" fill="#0f172a">Device Layer</text>
      <text x="28" y="124" font-size="15" fill="#475569">Sensors</text>
      <text x="28" y="148" font-size="15" fill="#475569">PLC / MCU / Machines</text>
    </g>

    <g transform="translate(360 210)">
      <rect width="210" height="162" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
      <circle cx="44" cy="44" r="20" fill="#0284c7"/>
      <path d="M34 48 C48 30 56 58 72 40" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <text x="28" y="92" font-size="24" font-weight="700" fill="#0f172a">Collector</text>
      <text x="28" y="124" font-size="15" fill="#475569">Normalize fields</text>
      <text x="28" y="148" font-size="15" fill="#475569">Cache / upload data</text>
    </g>

    <g transform="translate(628 210)">
      <rect width="210" height="162" rx="16" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
      <circle cx="44" cy="44" r="20" fill="#475569"/>
      <path d="M34 40 H54 V34 L70 48 L54 62 V56 H34 Z" fill="#ffffff"/>
      <text x="28" y="92" font-size="24" font-weight="700" fill="#0f172a">Service Layer</text>
      <text x="28" y="124" font-size="15" fill="#475569">Status engine</text>
      <text x="28" y="148" font-size="15" fill="#475569">Alert rules / history</text>
    </g>

    <g transform="translate(896 210)">
      <rect width="210" height="162" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <circle cx="44" cy="44" r="20" fill="#ea580c"/>
      <rect x="32" y="34" width="24" height="24" rx="3" fill="#ffffff"/>
      <path d="M36 52 L42 45 L48 49 L54 39" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
      <text x="28" y="92" font-size="24" font-weight="700" fill="#0f172a">Dashboard</text>
      <text x="28" y="124" font-size="15" fill="#475569">Line overview</text>
      <text x="28" y="148" font-size="15" fill="#475569">Health and alerts</text>
    </g>
  </g>

  <g stroke="#334155" stroke-width="3" marker-end="url(#arrow)" fill="none">
    <path d="M315 291 H345"/>
    <path d="M583 291 H613"/>
    <path d="M851 291 H881"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="146" y="438" width="246" height="70" rx="14" fill="#fef2f2" stroke="#dc2626"/>
    <text x="170" y="468" font-size="20" font-weight="700" fill="#991b1b">Alert Flow</text>
    <text x="170" y="493" font-size="15" fill="#7f1d1d">abnormal state -> rule -> notice</text>

    <rect x="476" y="438" width="246" height="70" rx="14" fill="#eff6ff" stroke="#2563eb"/>
    <text x="500" y="468" font-size="20" font-weight="700" fill="#1e3a8a">History Data</text>
    <text x="500" y="493" font-size="15" fill="#1e40af">events, status, trend records</text>

    <rect x="806" y="438" width="246" height="70" rx="14" fill="#ecfdf5" stroke="#059669"/>
    <text x="830" y="468" font-size="20" font-weight="700" fill="#064e3b">Maintainability</text>
    <text x="830" y="493" font-size="15" fill="#065f46">observable and traceable system</text>
  </g>
</svg>
